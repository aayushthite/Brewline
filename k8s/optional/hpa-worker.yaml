# OPTIONAL exercise. Needs metrics-server (minikube addons enable metrics-server).
# Apply with: kubectl apply -f k8s/optional/hpa-worker.yaml
# Then break the machine in the UI and watch worker replicas change: kubectl -n brewline get hpa -w
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: brewline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
