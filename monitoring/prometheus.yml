# Prometheus config for Docker Compose.
global:
  scrape_interval: 5s       # short on purpose so practice dashboards feel live
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # DNS service discovery: "api" / "worker" resolve to every replica's IP,
  # so scaling with `docker compose up --scale worker=4` is picked up automatically.
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
